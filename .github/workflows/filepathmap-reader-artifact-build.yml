name: FilePathMap reader artifact build

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Upload PR-controlled Build Output API artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-vercel-output
          path: .vercel/output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
