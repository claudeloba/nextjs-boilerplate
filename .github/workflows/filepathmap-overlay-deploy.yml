name: filepathmap-overlay-deploy

on:
  workflow_run:
    workflows:
      - filepathmap-overlay-producer
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy-overlay:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_PTl8qXykscsCWQIf4x3DCNr0
      VERCEL_PROJECT_ID: prj_mQYnUHc5DvabYdUTli6UheKfFHAY
      TRUSTED_MARKER: METADATA_ONLY_OVERLAY_TRUSTED_FILE_20260707_${{ github.event.workflow_run.id }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build trusted prebuilt output
        run: |
          set -euo pipefail
          node scripts/build-trusted-prebuilt-output.mjs
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Capture trusted handler hash before overlay
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum .vercel/output/functions/api/workflow-manifest.func/api/workflow-manifest.js | tee evidence/handler-before.sha256

      - name: Download PR metadata overlay
        uses: actions/download-artifact@v4
        with:
          name: metadata-only-overlay
          path: overlay-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Overlay only .vc-config.json
        run: |
          set -euo pipefail
          find overlay-download -type f | sort | tee evidence/overlay-file-list.txt
          file_count="$(find overlay-download -type f | wc -l | tr -d ' ')"
          test "$file_count" = "1"

          overlay_config="$(find overlay-download -type f -name .vc-config.json -print -quit)"
          test -n "$overlay_config"

          if find overlay-download -type f \( -name '*.js' -o -name '*.ts' -o -name 'package.json' \) | grep .; then
            echo "Downloaded overlay contains code, not only metadata" >&2
            exit 1
          fi

          jq -e '.filePathMap[".nestjs/workflow/manifest.json"] == ".vercel/trusted-deploy-marker.txt"' "$overlay_config"
          cp "$overlay_config" .vercel/output/functions/api/workflow-manifest.func/.vc-config.json

      - name: Prove handler unchanged and marker absent from output
        run: |
          set -euo pipefail
          sha256sum .vercel/output/functions/api/workflow-manifest.func/api/workflow-manifest.js | tee evidence/handler-after.sha256
          cmp evidence/handler-before.sha256 evidence/handler-after.sha256

          printf '%s\n' "$TRUSTED_MARKER" > .vercel/trusted-deploy-marker.txt
          stat .vercel/trusted-deploy-marker.txt | tee evidence/trusted-marker-stat.txt

          if grep -R "$TRUSTED_MARKER" .vercel/output; then
            echo "Trusted marker unexpectedly exists inside .vercel/output before deploy" >&2
            exit 1
          fi

      - name: Deploy trusted output with overlaid metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g vercel@54.21.1
          vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tee evidence/deploy.log
          grep -Eo 'https://[^ ]+\.vercel\.app' evidence/deploy.log | tail -n 1 > evidence/deployment-url.txt
          test -s evidence/deployment-url.txt

      - name: Fetch trusted reader output
        run: |
          set -euo pipefail
          deployment_url="$(cat evidence/deployment-url.txt)"
          curl -fsS "$deployment_url/api/workflow-manifest" | tee evidence/reader-body.txt
          grep -Fx "$TRUSTED_MARKER" evidence/reader-body.txt

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-only-overlay-proof
          path: evidence
          retention-days: 7
