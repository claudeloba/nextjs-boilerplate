name: filepathmap-overlay-producer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  produce-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove artifact is metadata-only
        run: |
          set -euo pipefail
          overlay_config="overlay/.vercel/output/functions/api/workflow-manifest.func/.vc-config.json"
          test -f "$overlay_config"

          find overlay -type f | sort | tee overlay-file-list.txt
          file_count="$(find overlay -type f | wc -l | tr -d ' ')"
          test "$file_count" = "1"

          if find overlay -type f \( -name '*.js' -o -name '*.ts' -o -name 'package.json' \) | grep .; then
            echo "Overlay artifact contains code, not only metadata" >&2
            exit 1
          fi

          jq -e '.filePathMap[".nestjs/workflow/manifest.json"] == ".vercel/trusted-deploy-marker.txt"' "$overlay_config"

      - name: Upload metadata-only overlay
        uses: actions/upload-artifact@v4
        with:
          name: metadata-only-overlay
          path: overlay
          include-hidden-files: true
          retention-days: 1

